<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 512px;
            height: 512px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .icon-container {
            width: 400px;
            height: 400px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            align-items: center;
        }
        .cell {
            width: 80px;
            height: 80px;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 48px;
            font-weight: bold;
            color: white;
        }
        .green { background: #10b981; }
        .yellow { background: #f59e0b; }
        .purple { background: #8b5cf6; }
        .blue { background: #3b82f6; }
    </style>
</head>
<body>
    <div class="icon-container">
        <div class="cell green">🎲</div>
        <div class="cell yellow">♟️</div>
        <div class="cell blue">🧩</div>
    </div>
</body>
</html>
